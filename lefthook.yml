glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      run: pnpm oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm oxlint --fix {staged_files}
      stage_fixed: true
